<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Crochet flower keychain">
  <defs>
    <radialGradient id="kc-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#EAF0E2"/><stop offset="100%" stop-color="#D8E4CC"/>
    </radialGradient>
    <linearGradient id="kc-p1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0B7BF"/><stop offset="100%" stop-color="#DE96A0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="520" fill="url(#kc-bg)"/>
  <!-- ring + chain -->
  <circle cx="300" cy="96" r="34" fill="none" stroke="#B9985A" stroke-width="12"/>
  <circle cx="300" cy="96" r="34" fill="none" stroke="#D8BC7E" stroke-width="5"/>
  <g stroke="#C9A86A" stroke-width="9" fill="none" stroke-linecap="round">
    <circle cx="300" cy="150" r="11"/><circle cx="300" cy="176" r="11"/><circle cx="300" cy="202" r="11"/>
  </g>
  <!-- little flower -->
  <g transform="translate(300 300)">
    <g fill="url(#kc-p1)" stroke="#C56B78" stroke-width="2.5" stroke-dasharray="6 6">
      <ellipse cx="0" cy="-70" rx="30" ry="52"/>
      <ellipse cx="67" cy="-22" rx="30" ry="52" transform="rotate(72 67 -22)"/>
      <ellipse cx="41" cy="57" rx="30" ry="52" transform="rotate(144 41 57)"/>
      <ellipse cx="-41" cy="57" rx="30" ry="52" transform="rotate(216 -41 57)"/>
      <ellipse cx="-67" cy="-22" rx="30" ry="52" transform="rotate(288 -67 -22)"/>
    </g>
    <circle r="34" fill="#F2C94C"/>
    <circle r="34" fill="none" stroke="#E0B03A" stroke-width="3" stroke-dasharray="3 6"/>
    <g fill="#E0A92E"><circle cx="-10" cy="-6" r="3.5"/><circle cx="9" cy="-10" r="3.5"/><circle cx="12" cy="9" r="3.5"/><circle cx="-7" cy="11" r="3.5"/><circle cx="0" cy="0" r="3.5"/></g>
  </g>
</svg>
