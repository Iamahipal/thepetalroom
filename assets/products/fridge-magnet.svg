<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Crochet flower fridge magnets">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2F4"/><stop offset="100%" stop-color="#DCE3E7"/>
    </linearGradient>
    <linearGradient id="fm-fridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F6F7"/><stop offset="100%" stop-color="#E3E9EC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="520" fill="url(#fm-bg)"/>
  <!-- fridge panel -->
  <rect x="120" y="70" width="360" height="400" rx="26" fill="url(#fm-fridge)" stroke="#CBD4D8" stroke-width="3"/>
  <rect x="430" y="150" width="14" height="120" rx="7" fill="#C3CDD2"/>
  <!-- three magnet flowers -->
  <g transform="translate(230 200)">
    <g fill="#EBA6AE" stroke="#C56B78" stroke-width="3" stroke-dasharray="6 6">
      <ellipse cx="0" cy="-52" rx="22" ry="40"/><ellipse cx="49" cy="-16" rx="22" ry="40" transform="rotate(72 49 -16)"/>
      <ellipse cx="30" cy="42" rx="22" ry="40" transform="rotate(144 30 42)"/><ellipse cx="-30" cy="42" rx="22" ry="40" transform="rotate(216 -30 42)"/>
      <ellipse cx="-49" cy="-16" rx="22" ry="40" transform="rotate(288 -49 -16)"/>
    </g>
    <circle r="24" fill="#F2C94C"/><circle r="24" fill="none" stroke="#E0B03A" stroke-width="3" stroke-dasharray="3 6"/>
  </g>
  <g transform="translate(350 300)">
    <g fill="#C9A0D6" stroke="#9A6BAC" stroke-width="3" stroke-dasharray="6 6">
      <ellipse cx="0" cy="-52" rx="22" ry="40"/><ellipse cx="49" cy="-16" rx="22" ry="40" transform="rotate(72 49 -16)"/>
      <ellipse cx="30" cy="42" rx="22" ry="40" transform="rotate(144 30 42)"/><ellipse cx="-30" cy="42" rx="22" ry="40" transform="rotate(216 -30 42)"/>
      <ellipse cx="-49" cy="-16" rx="22" ry="40" transform="rotate(288 -49 -16)"/>
    </g>
    <circle r="24" fill="#F2C94C"/><circle r="24" fill="none" stroke="#E0B03A" stroke-width="3" stroke-dasharray="3 6"/>
  </g>
  <g transform="translate(215 355) scale(0.8)">
    <g fill="#A9C08F" stroke="#7E9668" stroke-width="3" stroke-dasharray="6 6">
      <ellipse cx="0" cy="-52" rx="22" ry="40"/><ellipse cx="49" cy="-16" rx="22" ry="40" transform="rotate(72 49 -16)"/>
      <ellipse cx="30" cy="42" rx="22" ry="40" transform="rotate(144 30 42)"/><ellipse cx="-30" cy="42" rx="22" ry="40" transform="rotate(216 -30 42)"/>
      <ellipse cx="-49" cy="-16" rx="22" ry="40" transform="rotate(288 -49 -16)"/>
    </g>
    <circle r="24" fill="#F2C94C"/>
  </g>
</svg>
