      <ellipse cx="38" cy="52" rx="26" ry="46" transform="rotate(144 38 52)"/>
      <ellipse cx="-38" cy="52" rx="26" ry="46" transform="rotate(216 -38 52)"/>
      <ellipse cx="-61" cy="-20" rx="26" ry="46" transform="rotate(288 -61 -20)"/>
