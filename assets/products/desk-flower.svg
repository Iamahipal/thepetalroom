      <ellipse cx="35" cy="49" rx="24" ry="44" transform="rotate(144 35 49)"/><ellipse cx="-35" cy="49" rx="24" ry="44" transform="rotate(216 -35 49)"/>
      <ellipse cx="-57" cy="-19" rx="24" ry="44" transform="rotate(288 -57 -19)"/>
