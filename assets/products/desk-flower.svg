<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Crochet desk flower in a pot">
  <defs>
    <radialGradient id="dk-bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#FBF1E7"/><stop offset="100%" stop-color="#F0E0CF"/>
    </radialGradient>
    <linearGradient id="dk-p1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3B9AA"/><stop offset="100%" stop-color="#E29B88"/>
    </linearGradient>
    <linearGradient id="dk-pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A38C"/><stop offset="100%" stop-color="#C4876E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="520" fill="url(#dk-bg)"/>
  <!-- stems -->
  <g stroke="#8FA382" stroke-width="8" fill="none" stroke-linecap="round">
