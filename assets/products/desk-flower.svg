    <circle r="26" fill="#F2C94C"/>
  </g>
  <g transform="translate(368 262) scale(0.72)">
    <g fill="#C9A0D6" stroke="#9A6BAC" stroke-width="3" stroke-dasharray="6 6">
      <ellipse cx="0" cy="-60" rx="24" ry="44"/><ellipse cx="57" cy="-19" rx="24" ry="44" transform="rotate(72 57 -19)"/>
      <ellipse cx="35" cy="49" rx="24" ry="44" transform="rotate(144 35 49)"/><ellipse cx="-35" cy="49" rx="24" ry="44" transform="rotate(216 -35 49)"/>
